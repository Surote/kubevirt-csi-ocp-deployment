apiVersion: v1
kind: ConfigMap
metadata:
  name: driver-config
  namespace: kubevirt-csi-driver
data:
  infraClusterNamespace: swongpai-virt
  infraClusterLabels: csi-driver/cluster=ocp-vm-sno
  # Keys are lowercase: the driver's struct tags are lowercase even though
  # upstream docs show "StorageClasses".
  infraStorageClassEnforcement: |
    allowAll: false
    allowDefault: false
    allowList: [lvms-vg1]
    storageSnapshotMapping:
    - storageClasses: [lvms-vg1]
      volumeSnapshotClasses: [lvms-vg1]
