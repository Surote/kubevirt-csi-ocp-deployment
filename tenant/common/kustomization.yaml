- https://github.com/kubevirt/csi-driver//deploy/tenant/base?ref=b7b6b9aa20e1555baccfb6efbda5092edbc6db02
images:
- name: quay.io/kubevirt/kubevirt-csi-driver
  digest: sha256:44c98353e6137455d6a393ad13e04f60e10ee49fdcd00cf078f7f7084714f409
patches:
- path: driver-config.yaml
- path: storage-classes.yaml
